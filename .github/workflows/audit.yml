name: Audit

on:
  pull_request:
  push:
    branches: [main]
  # Advisories are published without any change here, so look weekly too.
  schedule:
    - cron: "0 15 * * 1"

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - name: Advisories for every crate in Cargo.lock
        run: cargo deny --locked check advisories
