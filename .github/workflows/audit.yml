name: Audit

on:
  pull_request:
  push:
    branches: [main]
  # Advisories are published without any change here, so look weekly too.
  schedule:
    - cron: "0 15 * * 1"

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2
      - name: Advisories for every crate in Cargo.lock
        run: cargo deny --locked check advisories
