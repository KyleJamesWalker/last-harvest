name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to
        required: true

permissions:
  contents: write

jobs:
  device:
    runs-on: ubuntu-24.04-arm
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Fetch the private assets
        env:
          ASSETS_DEPLOY_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ASSETS_DEPLOY_KEY" > ~/.ssh/assets
          chmod 600 ~/.ssh/assets
          git config submodule.assets/private.url "git@github.com:${{ github.repository_owner }}/last-harvest-assets.git"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/assets -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init --depth 1 assets/private

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.22.3

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
          ALSA_LIB=/usr/lib/aarch64-linux-gnu/libasound.so.2 scripts/sysroot.sh
          scripts/build-device.sh
          cargo run -q -p last-harvest-pack -- game_data.pak

      - name: Package
        run: |
          mkdir -p dist/last-harvest/data/enemies dist/last-harvest/data/players dist/last-harvest/data/mods dist/Imgs
          cp target/aarch64-unknown-linux-gnu/release/last-harvest dist/last-harvest/
          cp assets/data-README.txt dist/last-harvest/data/README.txt
          cp assets/LastHarvest.sh dist/
          cp assets/LastHarvest.png dist/Imgs/
          tar -C dist -czf "last-harvest-$TAG-aarch64-linux.tar.gz" .

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "last-harvest-$TAG-aarch64-linux.tar.gz" game_data.pak --clobber

  # The public card editor, built without the tileset, on GitHub Pages.
  mod-editor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The game crate's build reads the tileset for the sprites' places in the atlas, though none of its pixels
      # reach this page.
      - name: Fetch the private assets
        env:
          ASSETS_DEPLOY_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ASSETS_DEPLOY_KEY" > ~/.ssh/assets
          chmod 600 ~/.ssh/assets
          git config submodule.assets/private.url "git@github.com:${{ github.repository_owner }}/last-harvest-assets.git"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/assets -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init --depth 1 assets/private

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build
        run: scripts/mod-editor.sh

      # Only the editor's own files may go out: never a tileset build or a stray asset.
      - name: Check the page holds only the editor
        run: |
          expected="apple-touch-icon.png icon-512.png icon.png index.html sprite-editor.js sprite-editor_bg.wasm"
          found=$(find target/mod-editor -mindepth 1 -printf '%P\n' | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')
          [ "$found" = "$expected" ] || { echo "unexpected files: $found"; exit 1; }
          cargo tree -e features -i last-harvest-game -p sprite-editor --no-default-features --features modding --target wasm32-unknown-unknown \
            | grep -q 'feature "embed"' && { echo "the tileset is built in"; exit 1; } || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/mod-editor
      - id: deploy
        uses: actions/deploy-pages@v4
