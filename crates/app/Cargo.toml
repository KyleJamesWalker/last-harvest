[package]
name = "last-harvest"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["embed"]
embed = ["last-harvest-game/embed"]
# The muOS handheld build, through the device's own SDL2.
muos = ["dep:sdl2"]

[[bin]]
name = "last-harvest"
path = "src/main.rs"

[[bin]]
name = "last-harvest-muos"
path = "src/muos.rs"
required-features = ["muos"]

[dependencies]
cpal = "0.16"
glow.workspace = true
png = "0.17"
last-harvest-game.workspace = true
last-harvest-render.workspace = true
lewton = "0.10"
last-harvest-pack = { path = "../pack", default-features = false, features = ["pak"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wayland"] }
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
glutin = { version = "0.32", default-features = false, features = ["egl"] }
jni = "0.21"
ndk = "0.9"
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
sdl2 = { version = "0.37", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.16", features = ["wasm-bindgen"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "console", "CssStyleDeclaration", "Document", "Element", "Event", "EventTarget", "Gamepad", "GamepadButton", "HtmlCanvasElement", "HtmlElement", "History", "KeyboardEvent", "Location", "MouseEvent", "NodeList", "Navigator", "Performance", "PointerEvent", "Storage", "WebGl2RenderingContext", "Window"] }
