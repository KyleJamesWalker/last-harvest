[package]
name = "last-harvest"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["embed"]
embed = ["last-harvest-game/embed"]

[dependencies]
cpal = "0.16"
glow.workspace = true
png = "0.17"
last-harvest-game.workspace = true
last-harvest-render.workspace = true
lewton = "0.10"
last-harvest-pack = { path = "../pack", default-features = false, features = ["pak"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wayland"] }
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.16", features = ["wasm-bindgen"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "console", "CssStyleDeclaration", "Document", "Element", "Event", "EventTarget", "Gamepad", "GamepadButton", "HtmlCanvasElement", "HtmlElement", "KeyboardEvent", "Location", "MediaQueryList", "MouseEvent", "Navigator", "Performance", "PointerEvent", "Storage", "WebGl2RenderingContext", "Window"] }
