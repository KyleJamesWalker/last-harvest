[package]
name = "last-harvest"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
cpal = "0.16"
glow.workspace = true
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wayland"] }
png = "0.17"
raw-window-handle = "0.6"
last-harvest-game.workspace = true
last-harvest-render.workspace = true
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
