<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-Nydo/qt4IikZmKpPO/sw8yMT79ghGjTC1bAvVNDqcV0='; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LastHarvest</title>
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ebebf2; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font: 18px -apple-system, system-ui, sans-serif;
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  /* Both 1024x768 screens, top above bottom: 2:3, as large as fits. */
  #screens, #start { width: min(100vw, 100vh * 2 / 3); height: min(100vh, 150vw);
                     width: min(100vw, 100dvh * 2 / 3); height: min(100dvh, 150vw); }
  #screens { display: block; touch-action: none; outline: none; }
  #start { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
           background: rgba(0, 0, 0, 0.6); cursor: pointer; text-align: center; }
  #start[hidden] { display: none; }
  #start b { font-size: 34px; color: #f2bf4d; }
  #start p { margin: 0 24px; max-width: 30em; line-height: 1.5; color: #c8c8d2; font-size: 15px; }
  #start .screens { display: flex; gap: 12px; }
  #start button { font: inherit; color: #ebebf2; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.25);
                  border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  #start button[aria-pressed="true"] { border-color: #f2bf4d; color: #f2bf4d; }
  #start .mods { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin: 0 24px; font-size: 15px; cursor: default; }
  #start .mods button { padding: 4px 10px; font-size: 15px; }
  #start .mods [data-drop] { margin-left: 4px; padding: 2px 8px; border-width: 1px; }
  #mod-list { display: contents; }
  #start .mod { padding: 4px 4px 4px 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); }
  #start .mod:not(:has(button)) { padding-right: 10px; }
  /* Top left, clear of the touch controls' Pause (top right) and stick (lower left). */
  #fullscreen { position: fixed; z-index: 2; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
                width: 40px; height: 40px; padding: 8px; border: 0; border-radius: 6px; background: rgba(0, 0, 0, 0.4);
                color: #ebebf2; opacity: 0.6; cursor: pointer; }
  #fullscreen:hover, #fullscreen:focus-visible { opacity: 1; }
  #fullscreen[hidden], #fullscreen[data-on="true"] .enter, #fullscreen:not([data-on="true"]) .leave { display: none; }
  .failure { position: absolute; z-index: 1; top: 0; margin: 12px; padding: 12px; background: #5a1e1e; color: #fff; white-space: pre-wrap; }
</style>
</head>
<body data-pak="game_data.pak">
<canvas id="screens" tabindex="0"></canvas>
<button id="fullscreen" type="button" title="Full screen" aria-label="Full screen" hidden>
  <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="leave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>
<div id="start">
  <b id="start-label">Loading…</b>
  <div class="screens">
    <button type="button" data-screens="1" aria-pressed="true">One screen</button>
    <button type="button" data-screens="2" aria-pressed="false">Two screens</button>
  </div>
  <div class="mods" data-mods>
    <span id="mod-list">No mods</span>
    <button type="button" id="add-mod">Add mod…</button>
  </div>
  <p>Arrows move. X is A, Z is B, S is X, A is Y, Enter is Start, 1 and W are L1 and R1, Q and 2 are L2 and R2.
  The mouse or a finger is a touch: on the on-screen controls with one screen, on the bottom screen with two. Gamepads work too.</p>
</div>
<script type="module">
  import init, { run } from "./last-harvest.js";

  const label = document.getElementById("start-label");

  // Browsers without the Fullscreen API for pages (Safari on iPhone) keep the button hidden.
  const full = document.getElementById("fullscreen");
  const root = document.documentElement;
  if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
    const isOn = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    const mark = () => {
      const on = isOn();
      full.dataset.on = String(on);
      full.title = on ? "Leave full screen" : "Full screen";
      full.setAttribute("aria-label", full.title);
    };
    full.addEventListener("click", () => {
      if (isOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      document.getElementById("screens").focus();
    });
    document.addEventListener("fullscreenchange", mark);
    document.addEventListener("webkitfullscreenchange", mark);
    full.hidden = false;
  }
  const hint = document.querySelector("#start p");

  async function download(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`${url}: ${response.status} ${response.statusText}`);
    const total = Number(response.headers.get("content-length")) || 0;
    const reader = response.body.getReader();
    const parts = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value);
      got += value.length;
      label.textContent = total ? `Loading… ${Math.min(99, Math.floor((got * 100) / total))}%` : `Loading… ${(got / 1e6).toFixed(1)} MB`;
    }
    const bytes = new Uint8Array(got);
    let at = 0;
    for (const part of parts) {
      bytes.set(part, at);
      at += part.length;
    }
    return bytes;
  }

  // Mod packs the player adds stay in this browser, in the IndexedDB the card editor on the same site also uses;
  // the game reads them as it loads, so a change reloads the page.
  const files = (mode, use) => new Promise((done, fail) => {
    const open = indexedDB.open("last-harvest", 1);
    open.onupgradeneeded = () => open.result.createObjectStore("files");
    open.onerror = () => fail(open.error);
    open.onsuccess = () => {
      const t = open.result.transaction("files", mode);
      const request = use(t.objectStore("files"));
      t.oncomplete = () => done(request.result);
      t.onerror = () => fail(t.error);
      t.onabort = () => fail(t.error);
    };
  });
  const range = prefix => IDBKeyRange.bound(prefix, prefix + "\uffff");
  const MOD = "mod:";
  const mods = await files("readonly", s => s.getAll(range(MOD))).catch(() => []);
  const sounds = await files("readonly", s => s.getAll(range("sound:"))).catch(() => []);
  mods.sort((a, b) => (a.name < b.name ? -1 : 1));
  const list = document.getElementById("mod-list");
  const chip = (text, drop) => {
    const span = Object.assign(document.createElement("span"), { className: "mod", textContent: text });
    if (drop) {
      const button = Object.assign(document.createElement("button"), { type: "button", textContent: "×", title: `Remove ${drop}` });
      button.dataset.drop = drop;
      button.setAttribute("aria-label", button.title);
      span.append(button);
    }
    return span;
  };
  // The card editor's keys, as crates/pack/src/browser.rs names them; the game lays its work over the added mods.
  const EDITOR = ["last-harvest-card:", "last-harvest-player:", "last-harvest-prop:", "last-harvest-map:", "last-harvest-table:"];
  const editor = Object.keys(localStorage).some(k => EDITOR.some(p => k.startsWith(p)));
  const chips = mods.map(m => chip(m.name, m.name));
  if (editor) chips.push(chip("Card editor work"));
  if (chips.length) list.replaceChildren(...chips);
  list.addEventListener("click", async e => {
    const name = e.target.closest("[data-drop]")?.dataset.drop;
    if (!name) return;
    await files("readwrite", s => s.delete(MOD + name)).catch(err => alert(`Couldn't remove ${name}: ${err}`));
    location.reload();
  });
  document.getElementById("add-mod").addEventListener("click", () => {
    const input = Object.assign(document.createElement("input"), { type: "file", accept: ".pak", multiple: true });
    input.onchange = async () => {
      try {
        for (const file of input.files) {
          const bytes = new Uint8Array(await file.arrayBuffer());
          await files("readwrite", s => s.put({ name: file.name, bytes }, MOD + file.name));
        }
      } catch (err) {
        alert(err?.name === "QuotaExceededError" ? "The browser's storage for this page is full" : `Couldn't keep the mod: ${err}`);
      }
      location.reload();
    };
    input.click();
  });

  try {
    const [pak] = await Promise.all([download(document.body.dataset.pak), init()]);
    run(pak, mods, sounds);
    label.textContent = "Click to start";
  } catch (e) {
    label.textContent = "The game couldn't load";
    hint.textContent = String(e.message ?? e);
  }
</script>
</body>
</html>
